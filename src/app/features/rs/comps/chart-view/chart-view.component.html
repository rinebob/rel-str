<section class="candlestick-chart-two">
  <h2>MSFT Candlestick Chart (Syncfusion Demo)</h2>
  <rs-chart-toolbar
    [zoomFactor]="zoomFactor"
    [zoomPosition]="zoomPosition"
    [useDataSubset]="useDataSubset()"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (resetZoom)="resetZoom()"
    (useSubset)="useSubset()"
    (goToStart)="goToStart()"
    (goToEnd)="goToEnd()"
  ></rs-chart-toolbar>
  <div class="chart-two-root">
    <div class="chart-two-main-flex-col">
      <div class="chart-two-plot-area" style="position: relative;">
        <!-- [candleData]="visibleCandleDataWithDummy()" -->
        <rs-pane
          [candleData]="visibleCandleData()"
          [plotAreaLeft]="plotAreaLeft"
          [plotAreaWidth]="plotAreaWidth"
          [xAxisTicks]="visibleXAxisTicks()"
          aria-label="RS Color Pane"
        ></rs-pane>
        @if (hasCandleData && chartPrimaryXAxis && candleData().length > 0) {
          <!-- Syncfusion built-in chart toolbar restored below -->
          <ejs-chart #msftChart id="candlestick-chart-two"
            [primaryXAxis]="{ valueType: 'DateTime', crosshairTooltip: { enable: true }, majorGridLines: { width: 0 } }"
            [primaryYAxis]="{ title: 'Price (USD)' }"
            [tooltip]="{ enable: tooltipEnabled }"
            [zoomSettings]="{ enableSelectionZooming: true, enablePinchZooming: true, mode: 'X' }"
            (axisLabelRender)="onAxisLabelRender($event)"
            (tooltipRender)="onTooltipRender($event)"
            (zoomComplete)="onChartZoomComplete($event)"
            (loaded)="onChartLoaded()">
            <e-series-collection>
              <e-series
                [dataSource]="visibleCandleData() || []"
                type='Candle'
                xName='x'
                high='high'
                low='low'
                open='open'
                close='close'
                name='MSFT'
                pointColorMapping='rsColor'>
              </e-series>
            </e-series-collection>
          </ejs-chart>
        }
      </div>
      @if (firstVisibleYear() !== null) {
        <div class="x-axis-year-label-row">
          <span class="x-axis-year-label">{{ firstVisibleYear() }}</span>
        </div>
      }
      <div class="rs-comparison-summary">
        RS Comparison: {{ rsComparisonSummary() }}
      </div>
    </div>
  </div>
</section>
