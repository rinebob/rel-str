<div class="backtest-dashboard">
  <header class="backtest-header">
    <h1>Strategy Backtests</h1>
    <p class="subtitle">Run, inspect, and manage RH Agent strategy backtests.</p>
  </header>

  <section class="backtest-content">
    <app-backtest-run-control
      [isLoading]="runStore.isLoading()"
      [statusFilter]="uiStore.statusFilter()"
      [dateFilter]="uiStore.dateFilter()"
      [strategyFilter]="uiStore.strategyFilter()"
      [strategyOptions]="runStore.strategyOptions()"
      [symbolSearch]="uiStore.symbolSearch()"
      [configSearch]="uiStore.configSearch()"
      [sortBy]="uiStore.sortBy()"
      [sortDirection]="uiStore.sortDirection()"
      [includeArchived]="uiStore.includeArchived()"
      (statusFilterChange)="uiStore.setStatusFilter($event)"
      (dateFilterChange)="uiStore.setDateFilter($event)"
      (strategyFilterChange)="uiStore.setStrategyFilter($event)"
      (symbolSearchChange)="uiStore.setSymbolSearch($event)"
      (configSearchChange)="uiStore.setConfigSearch($event)"
      (sortByChange)="uiStore.setSortBy($event)"
      (sortDirectionChange)="uiStore.setSortDirection($event)"
      (includeArchivedChange)="uiStore.setIncludeArchived($event)" />

    <div class="dashboard-body">
      <div class="run-list-wrapper">
        <app-backtest-run-list
          [runs]="uiStore.filteredRuns()"
          [selectedRunId]="runStore.selectedRunId()"
          [hasActiveFilters]="uiStore.hasActiveFilters()"
          (selectRun)="runStore.selectRun($event)" />
      </div>

      @if (runStore.selectedRunId()) {
        <div class="detail-panel">
          <app-backtest-run-summary
            class="summary-panel"
            [run]="runStore.selectedRun()"
            [permutations]="runStore.permutations()"
            [selectedPermutationId]="uiStore.selectedPermutationId()"
            [isLoadingPermutations]="runStore.permutationsStreaming()"
            (selectPermutation)="uiStore.setSelectedPermutationId($event)" />

          <app-backtest-permutation-detail
            class="permutation-panel"
            [permutation]="uiStore.selectedPermutation()" />
        </div>
      }
    </div>
  </section>
</div>
