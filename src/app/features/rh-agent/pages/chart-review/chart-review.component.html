<div class="chart-review" [class.fullscreen]="uiState.fullscreen()">
  <app-review-header
    [selectedSymbol]="selectedReviewSymbol()"
    [manualSymbol]="manualSymbol()"
    [status]="selectedSymbolStatus()"
    (back)="goToGroupedReview()"
    (history)="goToSignalHistory()"
    (accept)="onAcceptReview()"
    (watch)="onWatchReview()"
    (reject)="onRejectReview()"
    (loadSymbol)="loadManualSymbol($event)"
    (symbolKeydown)="onManualSymbolKeydown($event.event, $event.input)">
  </app-review-header>

  <!-- Master-Detail Layout -->
  @if (hasReviewSymbols() || manualSymbol()) {
    <div class="master-detail-container" [class.sidebar-collapsed]="uiState.sidebarCollapsed()">
      @if (uiState.sidebarCollapsed()) {
        <div class="collapsed-sidebar">
          <button mat-icon-button (click)="uiState.toggleSidebar()" matTooltip="Expand panel">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </div>
      } @else {
        <app-signal-list
          class="signal-list-wrapper"
          [selectedSymbol]="selectedReviewSymbol()"
          [manualSymbol]="manualSymbol()"
          (symbolSelected)="onReviewSymbolSelected($event)">
        </app-signal-list>
      }
      <app-signal-detail class="detail-wrapper" [manualSymbol]="selectedReviewSymbol() || manualSymbol()"></app-signal-detail>
    </div>
  } @else {
    <div class="empty-state">
      <mat-icon>inbox</mat-icon>
      <p>No symbols queued for review</p>
      <p class="hint">Mark symbols for review in Grouped Review first</p>
    </div>
  }
</div>
