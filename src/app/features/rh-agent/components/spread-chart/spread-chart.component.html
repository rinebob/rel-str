@if (hasSpreads()) {
  <ejs-chart
    #chart
    [primaryXAxis]="primaryXAxis"
    [primaryYAxis]="primaryYAxis()"
    [axes]="axes()"
    [series]="seriesCollection()"
    [legendSettings]="legendSettings"
    [tooltip]="tooltipSettings"
    [crosshair]="crosshairSettings"
    [zoomSettings]="zoomSettings"
    [chartArea]="chartArea"
    width="100%"
    height="100%"
  >
  </ejs-chart>
} @else {
  <div class="spread-chart-empty">
    <p>No spreads loaded. Build spreads and click Load to render.</p>
  </div>
}
