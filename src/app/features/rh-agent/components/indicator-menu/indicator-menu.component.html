<button mat-stroked-button [matMenuTriggerFor]="indicatorMenu" class="toolbar-menu-btn">
  <mat-icon>add_chart</mat-icon>
  Indicators
  <span class="active-chart-badge">{{ activeChartBadge() }}</span>
</button>
<mat-menu #indicatorMenu="matMenu" class="indicator-checkbox-menu">
  @for (option of options(); track option.id) {
    <button mat-menu-item (click)="$event.stopPropagation(); onToggle(option.id)" class="indicator-menu-item">
      <span class="menu-checkbox" [class.checked]="isSelected(option.id)">
        @if (isSelected(option.id)) {
          <mat-icon>check_box</mat-icon>
        } @else {
          <mat-icon>check_box_outline_blank</mat-icon>
        }
      </span>
      <span class="menu-label">{{ option.label }}</span>
    </button>
  }
</mat-menu>
