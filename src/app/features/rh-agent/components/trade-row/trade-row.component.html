<div class="trade-row" [class.disabled]="!row().enabled">
  <span class="col-go">
    <mat-slide-toggle
      [checked]="row().enabled"
      [disabled]="!isActionableRun()"
      (change)="toggleEnabled.emit(row().symbol)">
    </mat-slide-toggle>
  </span>
  <span class="col-symbol">{{ row().symbol }}</span>
  <span class="col-direction dir-{{ row().direction.toLowerCase() }}">{{ row().direction }}</span>
  <span class="col-signal">{{ row().signalType }}</span>
  <span class="col-size">
    <label class="field-label" for="size-{{ row().symbol }}">Size ($)</label>
    <input id="size-{{ row().symbol }}"
      type="number"
      placeholder="Size ($)"
      [value]="row().positionSize"
      (change)="onPositionSizeChange(+$any($event).target.value)"
      min="1"
      [max]="maxPositionSize()"
      [disabled]="!row().enabled">
  </span>
  <span class="col-stop">
    <label class="field-label" for="stop-{{ row().symbol }}">Stop %</label>
    <input id="stop-{{ row().symbol }}"
      type="number"
      placeholder="Stop %"
      [value]="row().stopLossPercent"
      (change)="onStopLossChange(+$any($event).target.value)"
      min="0"
      max="100"
      [disabled]="!row().enabled">
  </span>
  <span class="col-total">${{ row().enabled ? row().positionSize : 0 }}</span>
  <span class="col-actions">
    <button type="button" mat-icon-button
      [disabled]="!isActionableRun()"
      (click)="remove.emit(row().symbol)"
      matTooltip="Move back to Review">
      <mat-icon>undo</mat-icon>
    </button>
  </span>
</div>
