@if (hasSignal(); as signal) {
  <div class="signal-detail">
    <!-- Chart Area - Full height since info moved to header -->
    <div class="chart-area">
      @if (chartLoading()) {
        <div class="chart-loading">
          <mat-icon>show_chart</mat-icon>
          <span>Loading chart...</span>
        </div>
      } @else {
        <app-flex-chart 
          [chartData]="chartData()" 
          [config]="chartConfig()"
          height="100%">
        </app-flex-chart>
      }
    </div>
  </div>
} @else {
  <div class="detail-empty">
    <mat-icon>touch_app</mat-icon>
    <p>Select a signal to review</p>
  </div>
}
