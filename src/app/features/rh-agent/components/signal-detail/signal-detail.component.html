@if (showChart()) {
  <div class="signal-detail">
    <!-- Compact chart toolbar -->
    <div class="chart-toolbar">
      <!-- Left: Signals + Indicators menus -->
      <button mat-stroked-button [matMenuTriggerFor]="signalTypeMenu" class="toolbar-menu-btn"
        [class.has-filter]="uiStore.selectedSignalTypes().size > 0">
        <mat-icon>filter_list</mat-icon>
        Signals
        @if (uiStore.selectedSignalTypes().size > 0) {
          <span class="active-chart-badge">{{ uiStore.selectedSignalTypes().size }}</span>
        }
      </button>
      <mat-menu #signalTypeMenu="matMenu" class="indicator-checkbox-menu">
        @for (type of uiStore.signalTypes(); track type) {
          <button mat-menu-item (click)="uiStore.toggleSignalTypeFilter(type)" class="indicator-menu-item">
            <span class="menu-checkbox" [class.checked]="uiStore.selectedSignalTypes().has(type)">
              @if (uiStore.selectedSignalTypes().has(type)) {
                <mat-icon>check_box</mat-icon>
              } @else {
                <mat-icon>check_box_outline_blank</mat-icon>
              }
            </span>
            <span class="menu-label">{{ type }}</span>
          </button>
        }
      </mat-menu>
      <button mat-stroked-button [matMenuTriggerFor]="indicatorMenu" class="toolbar-menu-btn">
        <mat-icon>add_chart</mat-icon>
        Indicators
        <span class="active-chart-badge">{{ activeChartInterval() === BarsInterval.WEEKLY ? 'W' : activeChartInterval() === BarsInterval.MONTHLY ? 'M' : 'D' }}</span>
      </button>
      <mat-menu #indicatorMenu="matMenu" class="indicator-checkbox-menu">
        @for (option of activeChartIndicatorOptions(); track option.id) {
          <button mat-menu-item (click)="onToggleIndicator(option.id)" class="indicator-menu-item">
            <span class="menu-checkbox" [class.checked]="isIndicatorSelected(option.id)">
              @if (isIndicatorSelected(option.id)) {
                <mat-icon>check_box</mat-icon>
              } @else {
                <mat-icon>check_box_outline_blank</mat-icon>
              }
            </span>
            <span class="menu-label">{{ option.label }}</span>
          </button>
        }
      </mat-menu>
      <button mat-icon-button class="toolbar-icon-btn" (click)="showZoomToolbar.set(!showZoomToolbar())"
        [class.zoom-off]="!showZoomToolbar()"
        [matTooltip]="showZoomToolbar() ? 'Hide zoom toolbar' : 'Show zoom toolbar'">
        <mat-icon>{{ showZoomToolbar() ? 'zoom_in' : 'zoom_out' }}</mat-icon>
      </button>
      <!-- Spacer -->
      <span class="toolbar-spacer"></span>
      <!-- Right: D/W/M, range, layout, fullscreen -->
      <span class="interval-toggle">
        <button class="interval-btn" [class.active]="selectedInterval() === BarsInterval.DAILY"
          (click)="onIntervalChange(BarsInterval.DAILY)">D</button>
        <button class="interval-btn" [class.active]="selectedInterval() === BarsInterval.WEEKLY"
          (click)="onIntervalChange(BarsInterval.WEEKLY)">W</button>
        <button class="interval-btn" [class.active]="selectedInterval() === BarsInterval.MONTHLY"
          (click)="onIntervalChange(BarsInterval.MONTHLY)">M</button>
      </span>
      <span class="range-toggle">
        <button class="range-btn" [class.active]="selectedRange() === 'recent'" (click)="selectedRange.set('recent')">Recent</button>
        <button class="range-btn" [class.active]="selectedRange() === '6m'" (click)="selectedRange.set('6m')">6M</button>
        <button class="range-btn" [class.active]="selectedRange() === '1y'" (click)="selectedRange.set('1y')">1Y</button>
        <button class="range-btn" [class.active]="selectedRange() === '5y'" (click)="selectedRange.set('5y')">5Y</button>
        <button class="range-btn" [class.active]="selectedRange() === 'all'" (click)="selectedRange.set('all')">All</button>
      </span>
      <button mat-icon-button class="toolbar-icon-btn" (click)="uiState.toggleChartLayout()"
        [matTooltip]="uiState.chartLayout() === 'single' ? 'Three-chart layout' : 'Single-chart layout'">
        <mat-icon>{{ uiState.chartLayout() === 'single' ? 'grid_view' : 'crop_square' }}</mat-icon>
      </button>
      <button mat-icon-button class="toolbar-icon-btn" (click)="uiState.toggleFullscreen()"
        [matTooltip]="uiState.fullscreen() ? 'Exit fullscreen' : 'Fullscreen'">
        <mat-icon>{{ uiState.fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
      </button>
    </div>

    <!-- Chart Area -->
    <div class="chart-area">
      @if (chartLoading()) {
        <div class="chart-loading">
          <mat-spinner diameter="32"></mat-spinner>
          <span>Loading chart data...</span>
        </div>
      } @else if (uiState.chartLayout() === 'triple') {
        <!-- Triple chart layout: left (W top, M bottom) | right (D) -->
        <div class="triple-chart-grid">
          <div class="triple-left">
            <div class="triple-chart-cell" [class.active-chart]="activeChartInterval() === BarsInterval.WEEKLY" (click)="setActiveChart(BarsInterval.WEEKLY)">
              <app-flex-chart
                [chartData]="chartDataWeekly()"
                [config]="chartConfigWeekly()"
                [syncCrosshairDate]="crosshairDate()"
                (crosshairDateChange)="onCrosshairChange($event)"
                height="100%">
              </app-flex-chart>
            </div>
            <div class="triple-chart-cell" [class.active-chart]="activeChartInterval() === BarsInterval.MONTHLY" (click)="setActiveChart(BarsInterval.MONTHLY)">
              <app-flex-chart
                [chartData]="chartDataMonthly()"
                [config]="chartConfigMonthly()"
                [syncCrosshairDate]="crosshairDate()"
                (crosshairDateChange)="onCrosshairChange($event)"
                height="100%">
              </app-flex-chart>
            </div>
          </div>
          <div class="triple-right" [class.active-chart]="activeChartInterval() === BarsInterval.DAILY" (click)="setActiveChart(BarsInterval.DAILY)">
            <app-flex-chart
              [chartData]="chartData()"
              [config]="chartConfigDaily()"
              [syncCrosshairDate]="crosshairDate()"
              (crosshairDateChange)="onCrosshairChange($event)"
              height="100%">
            </app-flex-chart>
          </div>
        </div>
      } @else {
        <app-flex-chart 
          [chartData]="chartData()" 
          [config]="chartConfig()"
          height="100%">
        </app-flex-chart>
      }
    </div>
  </div>
} @else {
  <div class="detail-empty">
    <mat-icon>touch_app</mat-icon>
    <p>Select a signal to review</p>
  </div>
}
