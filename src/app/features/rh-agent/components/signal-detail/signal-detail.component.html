@if (showChart()) {
  <div class="signal-detail">
    <app-chart-toolbar
      [selectedInterval]="selectedInterval()"
      [selectedRange]="selectedRange()"
      [showZoomToolbar]="showZoomToolbar()"
      [activeChartInterval]="activeChartInterval()"
      [layout]="uiState.chartLayout()"
      [fullscreen]="uiState.fullscreen()"
      [indicatorOptions]="activeChartIndicatorOptions()"
      [selectedIndicatorIds]="activeSelectedIndicatorIds()"
      (intervalChange)="onIntervalChange($event)"
      (rangeChange)="selectedRange.set($event)"
      (zoomToggle)="showZoomToolbar.set(!showZoomToolbar())"
      (layoutToggle)="uiState.toggleChartLayout()"
      (fullscreenToggle)="uiState.toggleFullscreen()"
      (indicatorToggle)="onToggleIndicator($event)">
    </app-chart-toolbar>

    <!-- Chart Area -->
    <div class="chart-area">
      @if (chartLoading()) {
        <div class="chart-loading">
          <mat-spinner diameter="32"></mat-spinner>
          <span>Loading chart data...</span>
        </div>
      } @else if (uiState.chartLayout() === 'triple') {
        <!-- Triple chart layout: left (W top, M bottom) | right (D) -->
        <div class="triple-chart-grid">
          <div class="triple-left">
            <div class="triple-chart-cell" [class.active-chart]="activeChartInterval() === BarsInterval.WEEKLY" (click)="setActiveChart(BarsInterval.WEEKLY)">
              <app-flex-chart
                [chartData]="chartDataWeekly()"
                [config]="chartConfigWeekly()"
                [syncCrosshairDate]="crosshairDate()"
                (crosshairDateChange)="onCrosshairChange($event)"
                height="100%">
              </app-flex-chart>
            </div>
            <div class="triple-chart-cell" [class.active-chart]="activeChartInterval() === BarsInterval.MONTHLY" (click)="setActiveChart(BarsInterval.MONTHLY)">
              <app-flex-chart
                [chartData]="chartDataMonthly()"
                [config]="chartConfigMonthly()"
                [syncCrosshairDate]="crosshairDate()"
                (crosshairDateChange)="onCrosshairChange($event)"
                height="100%">
              </app-flex-chart>
            </div>
          </div>
          <div class="triple-right" [class.active-chart]="activeChartInterval() === BarsInterval.DAILY" (click)="setActiveChart(BarsInterval.DAILY)">
            <app-flex-chart
              [chartData]="chartData()"
              [config]="chartConfigDaily()"
              [syncCrosshairDate]="crosshairDate()"
              (crosshairDateChange)="onCrosshairChange($event)"
              height="100%">
            </app-flex-chart>
          </div>
        </div>
      } @else {
        <app-flex-chart 
          [chartData]="activeChartData()" 
          [config]="chartConfig()"
          height="100%">
        </app-flex-chart>
      }
    </div>
  </div>
} @else {
  <div class="detail-empty">
    <mat-icon>touch_app</mat-icon>
    <p>Select a signal to review</p>
  </div>
}
