<div class="rs-chart-view">
    @if (mainChart(); as main) {
        <section class="rs-chart-view__main">
            @for (mc of [main]; track mc.id) {
                <rs-chart
                    [id]="'main-' + mc.id"
                    [name]="mc.config.name"
                    [config]="mc.config"
                    [chartData]="mc.chartData"
                    [baselineData]="mc.baselineData"
                    [rsData]="mc.rsData"
                    [isMain]="true"
                    [zoomEnabled]="true"
                />
            }
        </section>
    }

    @if (smallCharts().length) {
        <section class="rs-chart-view__filmstrip">
            @for (chart of smallCharts(); track $index) {
                <button class="rs-chart-view__filmstrip-item" type="button" (click)="selectChart(chart.id)">
                    <rs-chart
                        [id]="'small-' + chart.id"
                        [name]="chart.config.name"
                        [config]="chart.config"
                        [chartData]="chart.chartData"
                        [baselineData]="chart.baselineData"
                        [rsData]="chart.rsData"
                        [isMain]="false"
                        [zoomEnabled]="false"
                    />
                </button>
            }
        </section>
    }
</div>
