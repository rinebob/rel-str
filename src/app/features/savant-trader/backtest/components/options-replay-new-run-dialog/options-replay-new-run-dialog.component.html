<h2 class="title">New Selection Replay</h2>

<div class="content">
  <div class="replay-form" [formGroup]="form">
    <label class="dse-field field-full">
      <span class="field-label">Template</span>
      <select class="dse-select" formControlName="templateId">
        @for (template of templates; track template.id) {
          <option [value]="template.id">{{ template.name }} — {{ template.description }}</option>
        }
      </select>
    </label>

    <div class="row-fields">
      <label class="dse-field field-symbols">
        <span class="field-label">Symbols</span>
        <input class="field-input" formControlName="symbolsText" placeholder="QQQ, SPY" />
        @if (form.controls.symbolsText.hasError('required') && form.controls.symbolsText.touched) {
          <span class="field-error">At least one symbol is required</span>
        }
      </label>

      <div class="date-fields">
        <label class="dse-field field-year">
          <span class="field-label">Year</span>
          <select class="dse-select" formControlName="startYear">
            @for (y of years; track y) {
              <option [value]="y">{{ y }}</option>
            }
          </select>
        </label>

        <label class="dse-field field-month">
          <span class="field-label">Month</span>
          <select class="dse-select" formControlName="startMonth">
            @for (m of months; track m.value) {
              <option [value]="m.value">{{ m.label }}</option>
            }
          </select>
        </label>

        <label class="dse-field field-day">
          <span class="field-label">Day</span>
          <select class="dse-select" formControlName="startDay">
            @for (d of dayOptions(); track d) {
              <option [value]="d">{{ d }}</option>
            }
          </select>
        </label>
      </div>
    </div>

    <p class="form-note">Replays the template's daily contract selection across the symbol's trading days, starting on this date.</p>
  </div>
</div>

<div class="actions" align="end">
  <button class="ds-btn" type="button" (click)="cancel()">Cancel</button>
  <button class="ds-btn fill" type="button" [disabled]="form.invalid" (click)="submit()">Start Replay</button>
</div>
