<div class="backtest-dashboard">
  @if (showSimRuns) {
  <section class="backtest-content">
    <app-backtest-run-control
      [isLoading]="runStore.isLoading()"
      [statusFilter]="uiStore.statusFilter()"
      [dateFilter]="uiStore.dateFilter()"
      [strategyFilter]="uiStore.strategyFilter()"
      [strategyOptions]="runStore.strategyOptions()"
      [symbolSearch]="uiStore.symbolSearch()"
      [configSearch]="uiStore.configSearch()"
      [sortBy]="uiStore.sortBy()"
      [sortDirection]="uiStore.sortDirection()"
      [includeArchived]="uiStore.includeArchived()"
      (statusFilterChange)="uiStore.setStatusFilter($event)"
      (dateFilterChange)="uiStore.setDateFilter($event)"
      (strategyFilterChange)="uiStore.setStrategyFilter($event)"
      (symbolSearchChange)="uiStore.setSymbolSearch($event)"
      (configSearchChange)="uiStore.setConfigSearch($event)"
      (sortByChange)="uiStore.setSortBy($event)"
      (sortDirectionChange)="uiStore.setSortDirection($event)"
      (includeArchivedChange)="uiStore.setIncludeArchived($event)"
      (newRun)="openNewRunDialog()" />

    <div class="dashboard-body">
      <div class="run-list-wrapper">
        <app-backtest-run-list
          [runs]="uiStore.filteredRuns()"
          [selectedRunId]="runStore.selectedRunId()"
          [hasActiveFilters]="uiStore.hasActiveFilters()"
          (selectRun)="runStore.selectRun($event)" />
      </div>

      @if (runStore.selectedRunId()) {
        <div class="detail-panel">
          <app-backtest-run-summary
            class="summary-panel"
            [run]="runStore.selectedRun()"
            [permutations]="runStore.permutations()"
            [selectedPermutationId]="uiStore.selectedPermutationId()"
            [isLoadingPermutations]="runStore.permutationsStreaming()"
            (selectPermutation)="uiStore.setSelectedPermutationId($event)" />

          <app-backtest-permutation-detail
            class="permutation-panel"
            [permutation]="selectedPermutation()"
            [reportTier]="runStore.selectedRun()?.reportTier" />
        </div>
      }
    </div>
  </section>
  }

  <section class="replay-content">
    <header class="replay-header">
      <h2 class="replay-title">Selection Replay</h2>
    </header>

    <app-options-replay-run-controls
      [isLoading]="replayStore.isLoading()"
      [hasActiveFilters]="replayStore.hasActiveFilters()"
      [statusFilter]="replayStore.statusFilter()"
      [templateFilter]="replayStore.templateFilter()"
      [symbolSearch]="replayStore.symbolSearch()"
      [sortBy]="replayStore.sortBy()"
      [sortDirection]="replayStore.sortDirection()"
      (newReplay)="openNewReplayDialog()"
      (statusFilterChange)="replayStore.setStatusFilter($event)"
      (templateFilterChange)="replayStore.setTemplateFilter($event)"
      (symbolSearchChange)="replayStore.setSymbolSearch($event)"
      (sortByChange)="replayStore.setSortBy($event)"
      (sortDirectionChange)="replayStore.setSortDirection($event)"
      (resetFilters)="replayStore.resetFilters()" />

    <div class="dashboard-body">
      <div class="run-list-wrapper">
        <app-options-replay-run-list
          [rows]="replayStore.filteredRows()"
          [contractLists]="replayStore.contractListById()"
          [analysisReadyListIds]="replayStore.analysisReadyListIds()"
          [analyzingListIds]="replayStore.analyzingListIds()"
          [isLoading]="replayStore.isLoading()"
          [hasActiveFilters]="replayStore.hasActiveFilters()"
          [retryingRunIds]="replayStore.retryingRunIds()"
          [deletingRunIds]="replayStore.deletingRunIds()"
          (viewContracts)="openContractListDialog($event)"
          (analyze)="replayStore.startAnalysis($event)"
          (rerun)="replayStore.retryRun($event)"
          (deleteRun)="confirmDeleteReplayRun($event)" />
      </div>
    </div>
  </section>
</div>
