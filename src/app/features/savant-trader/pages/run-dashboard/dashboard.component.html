<div class="run-dashboard">
<div class="dashboard-content">
  <div class="dashboard-header">
    <div class="header-left">
      <mat-icon class="header-icon">smart_toy</mat-icon>
      <h1 class="header-title">Savant Trader</h1>
    </div>
    <div class="header-actions">
      <button mat-stroked-button class="review-latest-btn" (click)="goToSignalReview()"
        matTooltip="Review signals from the latest run">
        <mat-icon>account_tree</mat-icon>
        Review Latest Signals
      </button>
      <a mat-stroked-button [routerLink]="'/' + appRoutes.RH_ACCOUNT_INQUIRY"
        matTooltip="Open Robinhood MCP observation dashboard">
        <mat-icon>query_stats</mat-icon>
        Observation
      </a>
      <button mat-icon-button (click)="triggerOverviewSync()" [disabled]="isSyncingOverview()"
        matTooltip="Sync company overview data">
        @if (isSyncingOverview()) {
          <mat-spinner diameter="18"></mat-spinner>
        } @else {
          <mat-icon>business</mat-icon>
        }
      </button>
      <button mat-icon-button (click)="store.triggerBarsBackfill()"
        matTooltip="Backfill symbol-data with full D/W/M history">
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </div>

  @if (store.status()) {
    <app-run-status-bar
      [lastRunAt]="store.status()?.lastRunAt"
      [lastRunStatus]="store.status()?.lastRunStatus"
      [triggeredBy]="store.latestCompletedRun()?.triggeredBy"
      [scheduleDescription]="scheduleSummary()">
    </app-run-status-bar>
  }

  <app-run-control-card
    [isRunning]="store.isLoading()"
    [triggerFilter]="uiStore.triggerFilter()"
    [dateFilter]="uiStore.dateFilter()"
    [statusFilter]="uiStore.statusFilter()"
    (runNow)="triggerManualRun()"
    (refresh)="refreshData()"
    (triggerFilterChange)="uiStore.setTriggerFilter($event)"
    (dateFilterChange)="uiStore.setDateFilter($event)"
    (statusFilterChange)="uiStore.setStatusFilter($event)">
  </app-run-control-card>

  <app-run-metrics-strip
    [selectedRun]="uiStore.selectedRun()"
    [allRuns]="store.runs()">
  </app-run-metrics-strip>

  <app-run-history-panel
    [runs]="uiStore.filteredRuns()"
    [selectedRunId]="uiStore.selectedRunId()"
    (runSelected)="onRunSelected($event)"
    (runClicked)="onRunClicked($event)">
  </app-run-history-panel>
</div>
</div>
