<div class="chart-review" [class.fullscreen]="uiStateService.fullscreen()">
  <app-review-header
    [selectedSymbol]="selectedReviewSymbol()"
    [manualSymbol]="manualSymbol()"
    [companyName]="selectedSymbolName()"
    [status]="selectedSymbolStatus()"
    [activeList]="activeReviewList()"
    [viewportMode]="viewportMode()"
    [isActionableRun]="isActionableRun()"
    (back)="goToSignalReview()"
    (history)="goToSignalHistory()"
    (accept)="onAcceptReview()"
    (watch)="onWatchReview()"
    (reject)="onRejectReview()"
    (loadSymbol)="loadManualSymbol($event)"
    (symbolKeydown)="onManualSymbolKeydown($event.event, $event.input)"
    (newSymbols)="openNewSymbolsDialog()"
    (listChange)="onListChange($event)"
    (modeChange)="toggleViewportMode()">
  </app-review-header>

  @if (viewportMode() === 'signals') {
    <div class="active-run-context">
      <app-run-metrics-strip
        [selectedRun]="groupStore.viewedRun()"
        [allRuns]="[]">
      </app-run-metrics-strip>
    </div>
  }

  <!-- Master-Detail Layout -->
  <div class="master-detail-container" [class.sidebar-collapsed]="uiStateService.sidebarCollapsed()">
    @if (uiStateService.sidebarCollapsed()) {
      <div class="collapsed-sidebar">
        <button mat-icon-button (click)="uiStateService.toggleSidebar()" matTooltip="Expand panel">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    } @else {
      <app-signal-list
        class="signal-list-wrapper"
        [selectedSymbol]="selectedReviewSymbol()"
        [manualSymbol]="manualSymbol()"
        [symbols]="viewportSymbols()"
        [newSymbols]="newlyAddedSymbols()"
        (symbolSelected)="onReviewSymbolSelected($event)">
      </app-signal-list>
    }
    <app-signal-detail
      class="detail-wrapper"
      [manualSymbol]="selectedReviewSymbol() || manualSymbol()"
      [symbolLists]="symbolListStore.symbolLists()"
      [activeListFilter]="symbolListStore.activeListFilter()"
      [symbolIndex]="selectedReviewSymbolIndex()"
      [symbolCount]="reviewSymbolCount()"
      (toggleList)="onToggleList($event)"
      (monitor)="onMonitor($event)"
      (prevSymbol)="onPrevSymbol()"
      (nextSymbol)="onNextSymbol()">
    </app-signal-detail>
  </div>
</div>
