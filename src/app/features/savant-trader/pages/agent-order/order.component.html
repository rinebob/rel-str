<div class="signal-order-page">
  <!-- Header -->
  <div class="order-header">
    <button mat-icon-button class="back-btn" (click)="goBack()" matTooltip="Back to signal review">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <h1 class="order-title">
      <mat-icon>account_balance</mat-icon>
      Signal Order
    </h1>

    <span class="order-subtitle">
      {{ intentCount() }} intent{{ intentCount() === 1 ? '' : 's' }}
    </span>

    <div class="header-spacer"></div>
  </div>

  <!-- Master-Detail Layout -->
  <div class="master-detail">
    <!-- Left: Queue -->
    <app-order-queue
      class="queue-wrapper"
      [intents]="allIntents()"
      [selectedId]="selectedIntentId()"
      (intentSelected)="onIntentSelected($event)"
      (removeIntents)="onRemoveIntents($event)">
    </app-order-queue>

    <!-- Right: Ticket -->
    <div class="ticket-wrapper">
      @if (loading()) {
        <div class="loading-state">
          <mat-icon>hourglass_empty</mat-icon>
          <p>Loading intents…</p>
        </div>
      } @else if (error()) {
        <div class="error-state">
          <mat-icon>error_outline</mat-icon>
          <p>Failed to load orders</p>
          <p class="hint">{{ error() }}</p>
        </div>
      } @else {
        <app-order-ticket [intent]="selectedIntent()"></app-order-ticket>
      }
    </div>
  </div>
</div>
