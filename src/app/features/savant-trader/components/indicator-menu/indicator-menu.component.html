<span class="ms-menu-host">
<button class="toolbar-menu-btn ds-btn outline"
        aria-haspopup="menu" [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu($event)">
  <span class="dse-icon">add_chart</span>
  Indicators
  <span class="active-chart-badge">{{ activeChartBadge() }}</span>
</button>
@if (menuOpen()) {
<div class="dse-menu indicator-panel" role="menu" (click)="$event.stopPropagation()">
  @for (option of options(); track option.id) {
    <button class="menu-item rh-dropdown-menu-item" role="menuitemcheckbox"
            [attr.aria-checked]="isSelected(option.id)"
            (click)="onToggle(option.id)">
      <span class="menu-checkbox" [class.checked]="isSelected(option.id)">
        <span class="dse-icon">{{ isSelected(option.id) ? 'check_box' : 'check_box_outline_blank' }}</span>
      </span>
      <span class="menu-label">{{ option.label }}</span>
    </button>
  }
</div>
}
</span>
