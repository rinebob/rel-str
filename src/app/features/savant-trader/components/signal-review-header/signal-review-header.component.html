<div class="gr-header">
  <button class="back-btn icon-btn" (click)="back.emit()" title="Back">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <div class="signal-counts">
    <span class="signal-count">{{ totalSignalCount() }} symbols</span>
    <span class="badge tf">W {{ weeklySignalCount() }}</span>
    <span class="badge tf">D {{ dailySignalCount() }}</span>
  </div>

  @if (longCount() > 0 || shortCount() > 0) {
    <div class="dir-counts">
      <span class="badge dir-long">↑ {{ longCount() }}</span>
      <span class="badge dir-short">↓ {{ shortCount() }}</span>
    </div>
  }

  <app-signal-filter-pills
    [timeframe]="timeframe()"
    [direction]="direction()"
    (timeframeChange)="timeframeFilterChange.emit($event)"
    (directionChange)="directionFilterChange.emit($event)">
  </app-signal-filter-pills>

  <span class="pill-btn emph" title="Signals matching the current timeframe / direction / list filters">
    <mat-icon>notifications</mat-icon>
    Signals <span class="pill-count">{{ filteredSignalCount() }}</span>
  </span>

  <div class="toolbar-spacer"></div>

  <div class="pipeline-actions">
    <!-- #1016 — review-list removed; the flagged-review queue is
         session-local only. Disabled until the pages are repurposed. -->
    <button type="button" class="pill-btn review"
      [class.active]="reviewCount() > 0"
      disabled
      (click)="goToChartView.emit()" title="Review symbols">
      <mat-icon>visibility</mat-icon>
      Review <span class="pill-count">{{ reviewCount() }}</span>
    </button>
    <button type="button" class="pill-btn order"
      [class.active]="orderCount() > 0"
      [disabled]="orderCount() === 0 || !isActionableRun()"
      (click)="goToOrder.emit()" title="Go to signal order page">
      <mat-icon>shopping_cart</mat-icon>
      Order <span class="pill-count">{{ orderCount() }}</span>
    </button>
    <a class="pill-btn"
      [routerLink]="'/' + appRoutes.RH_ACCOUNT_INQUIRY" title="Open observation dashboard">
      <mat-icon>query_stats</mat-icon>
      Observation
    </a>
    <!-- #1016 — clears review flags; disabled with the flag feature. -->
    <button type="button" class="pill-btn small"
      disabled
      (click)="clearReviewFlags.emit()" title="Clear review flags">
      <mat-icon>playlist_remove</mat-icon>
    </button>
  </div>

  <app-rh-select-menu
    label="Group"
    [options]="dimensionOptions"
    [value]="groupDimension()"
    (valueChange)="dimensionChange.emit($event)">
  </app-rh-select-menu>

  <app-rh-select-menu
    label="List"
    [options]="sentinelOptions"
    [optionGroups]="listGroups()"
    [value]="activeListFilter()"
    (valueChange)="listFilterChange.emit($event)">
  </app-rh-select-menu>

  <button class="icon-btn" 
 [disabled]="activeListFilter() === 'ALL'"
 (click)="exportList.emit()" title="Export selected list">
    <mat-icon>download</mat-icon>
  </button>

  <button class="icon-btn" (click)="prev.emit()"
 [disabled]="!quickChartSymbol() || flatSymbols().indexOf(quickChartSymbol()!) <= 0" title="Previous symbol">
    <mat-icon>chevron_left</mat-icon>
  </button>
  <button class="icon-btn" (click)="next.emit()"
 [disabled]="!quickChartSymbol() || flatSymbols().indexOf(quickChartSymbol()!) >= flatSymbols().length - 1" title="Next symbol">
    <mat-icon>chevron_right</mat-icon>
  </button>

  <button class="icon-btn" (click)="toggleExpandAll.emit()" [title]="allExpanded() ? 'Collapse all' : 'Expand all'">
    <mat-icon>{{ allExpanded() ? 'unfold_less' : 'unfold_more' }}</mat-icon>
  </button>

  <button class="icon-btn" (click)="refresh.emit()" title="Refresh"
 [disabled]="loading()">
    <mat-icon>refresh</mat-icon>
  </button>

  <button class="icon-btn" (click)="toggleFullscreen.emit()" [title]="fullscreen() ? 'Exit fullscreen' : 'Fullscreen'">
    <mat-icon>{{ fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
  </button>
</div>
