<div class="gr-header">
  <button mat-icon-button class="back-btn" (click)="back.emit()" matTooltip="Back">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <h1 class="gr-title">
    <mat-icon>psychology</mat-icon>
    Signal Review
  </h1>

  <div class="signal-counts">
    <span class="signal-count">{{ totalSignalCount() }} symbols</span>
    <span class="signal-count tf-badge">W {{ weeklySignalCount() }}</span>
    <span class="signal-count tf-badge">D {{ dailySignalCount() }}</span>
  </div>

  @if (longCount() > 0 || shortCount() > 0) {
    <div class="dir-counts">
      <span class="dir-count long">↑ {{ longCount() }}</span>
      <span class="dir-count short">↓ {{ shortCount() }}</span>
    </div>
  }

  <app-signal-filter-pills
    [timeframe]="timeframe()"
    [direction]="direction()"
    (timeframeChange)="timeframeFilterChange.emit($event)"
    (directionChange)="directionFilterChange.emit($event)">
  </app-signal-filter-pills>

  <app-status-summary-chips [counts]="statusCounts()"></app-status-summary-chips>

  <div class="header-spacer"></div>

  <div class="pipeline-actions">
    <button type="button" class="pill-btn review"
      [class.active]="reviewCount() > 0"
      (click)="goToReview.emit()"
      matTooltip="Review symbols">
      <mat-icon>visibility</mat-icon>
      Review <span class="pill-count">{{ reviewCount() }}</span>
    </button>
    <button type="button" class="pill-btn accept"
      [class.active]="acceptedCount() > 0"
      [disabled]="acceptedCount() === 0 || !isActionableRun()"
      (click)="goToOrder.emit()"
      matTooltip="Go to signal order page">
      <mat-icon>shopping_cart</mat-icon>
      Order <span class="pill-count">{{ acceptedCount() }}</span>
    </button>
    <button type="button" class="pill-btn"
      (click)="goToTriageReport.emit()"
      matTooltip="View PACR triage report">
      <mat-icon>assignment</mat-icon>
      Report
    </button>
    <a class="pill-btn"
      [routerLink]="'/' + appRoutes.RH_ACCOUNT_INQUIRY"
      matTooltip="Open observation dashboard">
      <mat-icon>query_stats</mat-icon>
      Observation
    </a>
    <button type="button" class="pill-btn small"
      [disabled]="!isActionableRun()"
      (click)="clearReviewFlags.emit()"
      matTooltip="Clear review flags">
      <mat-icon>playlist_remove</mat-icon>
    </button>
  </div>

  <app-rh-select-menu
    label="Group"
    [options]="dimensionOptions"
    [value]="groupDimension()"
    (valueChange)="dimensionChange.emit($event)">
  </app-rh-select-menu>

  <app-rh-select-menu
    label="List"
    [options]="listFilterOptions"
    [value]="activeListFilter()"
    (valueChange)="listFilterChange.emit($event)">
  </app-rh-select-menu>

  <button mat-icon-button (click)="prev.emit()"
    [disabled]="!quickChartSymbol() || flatSymbols().indexOf(quickChartSymbol()!) <= 0"
    matTooltip="Previous symbol">
    <mat-icon>chevron_left</mat-icon>
  </button>
  <button mat-icon-button (click)="next.emit()"
    [disabled]="!quickChartSymbol() || flatSymbols().indexOf(quickChartSymbol()!) >= flatSymbols().length - 1"
    matTooltip="Next symbol">
    <mat-icon>chevron_right</mat-icon>
  </button>

  <button mat-icon-button (click)="toggleExpandAll.emit()"
    [matTooltip]="allExpanded() ? 'Collapse all' : 'Expand all'">
    <mat-icon>{{ allExpanded() ? 'unfold_less' : 'unfold_more' }}</mat-icon>
  </button>

  <button mat-icon-button (click)="refresh.emit()" matTooltip="Refresh"
    [disabled]="loading()">
    <mat-icon>refresh</mat-icon>
  </button>

  <button mat-icon-button (click)="toggleFullscreen.emit()"
    [matTooltip]="fullscreen() ? 'Exit fullscreen' : 'Fullscreen'">
    <mat-icon>{{ fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
  </button>
</div>
