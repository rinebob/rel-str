<div class="quick-charts-panel">
  <div class="qcp-body">
    @if (symbol()) {
      @if (profile()) {
        <div class="qcp-meta">
          <span class="qcp-symbol">{{ symbol() }}</span>
          <span class="qcp-name">{{ profile()?.name }}</span>
          <span class="qcp-sector">{{ profile()?.sector }}</span>
          <span class="qcp-industry">{{ profile()?.industry }}</span>
          <span class="qpc-mktcap">{{ marketCapLabel() }}</span>
        </div>
      }
      <app-quick-charts [symbol]="symbol()"></app-quick-charts>
    } @else {
      <div class="qcp-placeholder">
        <mat-icon>bar_chart</mat-icon>
        <p>Select a symbol to view signal charts</p>
      </div>
    }
  </div>
</div>
