<h2 mat-dialog-title>
  {{ symbol() }} {{ ticket()?.side | uppercase }} Order Ticket
</h2>

<mat-dialog-content>
  <app-order-ticket
    [ticket]="ticket()"
    [price]="price()"
    [tradingConfig]="tradingConfig()">
  </app-order-ticket>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
