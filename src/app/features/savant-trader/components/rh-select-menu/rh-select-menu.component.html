<span class="ms-menu-host">
<button [disabled]="disabled()" class="rh-select-btn ds-btn outline"
        aria-haspopup="listbox" [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu($event)">
  <span class="rh-select-label">{{ label() }}</span>
  <span class="rh-select-value">{{ activeLabel() }}</span>
  <mat-icon>arrow_drop_down</mat-icon>
</button>

@if (menuOpen()) {
<div class="dse-menu rh-select-menu-panel" role="listbox" (click)="$event.stopPropagation()">
  <ng-template #optionItem let-option>
    <button class="menu-item rh-dropdown-menu-item" role="option"
      [class.selected]="value() === option.value"
      [attr.aria-selected]="value() === option.value"
      (click)="select(option.value)" [title]="option.description ?? ''">
      <span class="menu-label">{{ option.label }}</span>
      @if (option.badges) {
        @for (badge of option.badges; track badge) {
          <span class="rh-menu-badge">{{ badge }}</span>
        }
      }
    </button>
  </ng-template>

  <!-- Flat options render first — surfaces pin their 'show all' sentinel
       ungrouped at the top, above the group headers. -->
  @for (opt of options(); track opt.value) {
    <ng-container *ngTemplateOutlet="optionItem; context: { $implicit: opt }"></ng-container>
  }
  @for (group of optionGroups(); track group.label) {
    <div class="rh-menu-group-header">{{ group.label }}</div>
    @for (opt of group.options; track opt.value) {
      <ng-container *ngTemplateOutlet="optionItem; context: { $implicit: opt }"></ng-container>
    }
  }
</div>
}
</span>
