<div class="signal-list-container">
  <div class="panel-header">
    <span class="panel-title">{{ manualSymbol() ?? 'Review' }}</span>
    <span class="panel-count">{{ items().length }}</span>
    @if (manualSymbol()) {
      <div class="tf-filter">
        <button class="tf-btn ds-btn" [class.active]="timeframeFilter() === 'all'" (click)="timeframeFilter.set('all')">All</button>
        <button class="tf-btn ds-btn" [class.active]="timeframeFilter() === SignalTimeframe.DAILY" (click)="timeframeFilter.set(SignalTimeframe.DAILY)">D</button>
        <button class="tf-btn ds-btn" [class.active]="timeframeFilter() === SignalTimeframe.WEEKLY" (click)="timeframeFilter.set(SignalTimeframe.WEEKLY)">W</button>
      </div>
    }
    <span class="header-spacer"></span>
    <button class="collapse-btn icon-btn" (click)="uiStateService.toggleSidebar()" title="Collapse panel">
      <span class="dse-icon">chevron_left</span>
    </button>
  </div>

  <div class="signal-list" role="listbox" aria-label="Signals">
    @for (item of items(); track item.trackId) {
      <button type="button"
        #listItem
        class="signal-item" role="option"
        [class.selected]="selectedSymbol() === item.symbol"
        [class.viewed]="dimmedSymbols().has(item.symbol)"
        [attr.aria-selected]="selectedSymbol() === item.symbol"
        (click)="onSelect(item.symbol)">
        <span class="dse-icon item-icon"
          [class]="'dir-' + (item.latestSignal ? item.latestSignal.direction : SignalDirection.LONG).toLowerCase()">
          {{ item.latestSignal && item.latestSignal.direction === SignalDirection.SHORT ? 'arrow_downward' : 'arrow_upward' }}
        </span>
        <div class="signal-main">
          @if (item.isHistoryRow && item.latestSignal) {
            <div class="signal-line-1">
              <span class="history-date">{{ item.latestSignal.barDate }}</span>
              <span class="badge type" [class.long]="item.latestSignal.direction === SignalDirection.LONG" [class.short]="item.latestSignal.direction === SignalDirection.SHORT">
                {{ item.latestSignal.signalType }}
              </span>
            </div>
            <div class="signal-line-2">{{ item.latestSignal.timeframe === SignalTimeframe.WEEKLY ? 'Weekly' : 'Daily' }} · {{ item.latestSignal.status }}</div>
          } @else {
            <div class="signal-line-1">
              <span class="symbol">{{ item.symbol }}</span>
              @if (newSymbols().includes(item.symbol)) {
                <span class="new-chip">NEW</span>
              }
              @if (item.detail) {
                <span class="row-detail">{{ item.detail }}</span>
              }
            </div>
            @if (item.name) {
              <div class="row-name">{{ item.name }}</div>
            }
            @if (item.recentSignals.length > 0) {
              <div class="signal-trail">
                @for (s of item.recentSignals; track s.barDate + '-' + s.timeframe + '-' + s.signalType) {
                  <span class="trail-item" [class.long]="s.direction === SignalDirection.LONG" [class.short]="s.direction === SignalDirection.SHORT">
                    <span class="trail-date">{{ s.barDate.slice(5) }}</span>
                    <span class="trail-type">{{ s.signalType }}</span>
                  </span>
                }
              </div>
            }
          }
        </div>
      </button>
    } @empty {
      <div class="empty-list">
        <p>Enter a symbol above to review</p>
      </div>
    }
  </div>
</div>
