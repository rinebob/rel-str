@if (store.activeList()) {
<div class="list-mini-controls">
  <button
    type="button"
    class="icon-btn"
    [disabled]="!store.canStepPrev()"
    aria-label="Previous chunk"
    (click)="step(-1)"
  >
    <span class="dse-icon">chevron_left</span>
  </button>
  <span class="mini-info">chunk {{ store.chunkInfo().index + 1 }}/{{ store.chunkInfo().total }}</span>
  <button
    type="button"
    class="icon-btn"
    [disabled]="!store.canStepNext()"
    aria-label="Next chunk"
    (click)="step(1)"
  >
    <span class="dse-icon">chevron_right</span>
  </button>
  <label class="mini-size">
    Size
    <select class="dse-select compact"
      [ngModel]="store.chunkSize()"
      (ngModelChange)="setChunkSize(+$event)"
    >
      @for (n of chunkSizeOptions; track n) { <option [value]="n">{{ n }}</option> }
    </select>
  </label>
  <button type="button" class="ds-btn outline" (click)="sendAll()">All</button>
  <button type="button" class="ds-btn outline" (click)="openPicker.emit()">Picker</button>
</div>
}
