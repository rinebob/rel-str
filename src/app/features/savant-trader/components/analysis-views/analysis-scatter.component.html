<div class="scatter-controls">
  <label class="dse-select">
    <select class="field-input" [ngModel]="xKey()" (ngModelChange)="setX($event)" aria-label="X axis column">
      @for (c of numericCols(); track c.key) {
        <option [value]="c.key">x: {{ c.label }}</option>
      }
    </select>
  </label>
  <label class="dse-select">
    <select class="field-input" [ngModel]="yKey()" (ngModelChange)="setY($event)" aria-label="Y axis column">
      @for (c of numericCols(); track c.key) {
        <option [value]="c.key">y: {{ c.label }}</option>
      }
    </select>
  </label>
  <label class="dse-select">
    <select class="field-input" [ngModel]="colorKey()" (ngModelChange)="setColor($event)" aria-label="Color column">
      <option value="">color: none</option>
      @for (c of colorCols(); track c.key) {
        <option [value]="c.key">color: {{ c.label }}</option>
      }
    </select>
  </label>
  @if (discreteX()) {
    <label class="dse-check">
      <input type="checkbox" [checked]="jitter()"
             (change)="setJitter($any($event.target).checked)" />
      jitter x
    </label>
  }
</div>

@if (points().length === 0) {
  <div class="empty-state">No plottable rows in the current filter.</div>
} @else {
  <ejs-chart
    [primaryXAxis]="primaryXAxis()"
    [primaryYAxis]="primaryYAxis()"
    [tooltip]="tooltip"
    [legendSettings]="legendSettings">
    <e-series-collection>
      @for (s of series(); track s.name) {
        <e-series
          type="Scatter"
          [dataSource]="s.data"
          xName="x"
          yName="y"
          tooltipMappingName="tradeId"
          [marker]="marker"
          [name]="s.name">
        </e-series>
      }
    </e-series-collection>
  </ejs-chart>
}
