<div class="histogram-controls">
  <span class="control-label">Bin width</span>
  <label class="dse-select width-select">
    <select class="field-input" [ngModel]="binWidth()" (ngModelChange)="setBinWidth($event)"
            aria-label="Histogram bin width">
      @for (w of widthOptions; track w) {
        <option [value]="w">{{ w }}%</option>
      }
    </select>
  </label>
  @if (baselineRows()) {
    <label class="dse-check">
      <input type="checkbox" [checked]="showBaseline()"
             (change)="setShowBaseline($any($event.target).checked)" />
      overlay {{ baselineLabel() }}
    </label>
  }
</div>

@if (chartData().length === 0) {
  <div class="empty-state">No rows with returns in the current filter.</div>
} @else {
  <ejs-chart
    [primaryXAxis]="primaryXAxis()"
    [primaryYAxis]="primaryYAxis"
    [tooltip]="tooltip"
    [legendSettings]="legendSettings()">
    <e-series-collection>
      @if (baselineActive()) {
        <!-- literal-sweep exception #1214: e-series fill is a Syncfusion
             chart input (canvas-rendered) — literal required. -->
        <e-series
          type="Column"
          [dataSource]="baselineData()"
          xName="cx"
          yName="count"
          fill="#9e9e9e"
          [opacity]="0.35"
          [name]="baselineLabel()">
        </e-series>
      }
      <e-series
        type="Column"
        [dataSource]="chartData()"
        xName="cx"
        yName="count"
        pointColorMapping="fill"
        name="filtered">
      </e-series>
    </e-series-collection>
  </ejs-chart>
}
