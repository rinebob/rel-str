<div class="status-row">
  <div class="status-chip">
    <mat-icon>schedule</mat-icon>
    <span class="status-label">Last Run:</span>
    <span class="status-value">
      {{ lastRunAt() ? (lastRunAt() | date: 'short') : 'Never' }}
    </span>
    @if (lastRunStatus()) {
      <span [class]="'status-badge status-' + (lastRunStatus() ?? '').toLowerCase()">
        {{ lastRunStatus() }}
      </span>
    }
  </div>
  <div class="status-chip">
    <mat-icon>{{ triggeredBy() === 'manual' ? 'touch_app' : 'schedule' }}</mat-icon>
    <span class="status-label">Triggered By:</span>
    <span class="status-value">{{ triggeredBy() ?? '—' }}</span>
  </div>
  <div class="status-chip">
    <mat-icon>repeat</mat-icon>
    <span class="status-label">Schedule:</span>
    <span class="status-value">{{ scheduleDescription() ?? '—' }}</span>
  </div>
</div>
