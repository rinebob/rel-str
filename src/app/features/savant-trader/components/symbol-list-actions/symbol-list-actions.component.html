<div class="list-actions" (click)="$event.stopPropagation()">
  @for (list of systemActionLists(); track list.key) {
    <button
      type="button"
      class="acr-btn {{ list.key.toLowerCase() }}"
      [class.active]="isInList(list)"
      [attr.aria-label]="'Toggle ' + list.label"
      (click)="toggleList.emit({ symbol: symbol(), listKey: list.key })"
      [matTooltip]="list.label">
      <mat-icon>{{ iconName(list) }}</mat-icon>
    </button>
  }
</div>
