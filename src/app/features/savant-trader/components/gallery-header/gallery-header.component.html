<div class="gallery-header">
  @if (marketDate()) {
    <span class="run-date" title="Market date of the viewed run">{{ marketDate() }}</span>
  }
  @let completedAt = runCompletedAt();
  @if (completedAt) {
    <span class="run-time" title="When the viewed run completed — data refresh time">{{ formatTimestampPT(completedAt) }} PT</span>
  }
  <span class="card-count" title="Visible cards / total cards for this run">
    {{ cardCount() }}<span class="card-count-total"> / {{ totalCardCount() }}</span>
  </span>

  <app-signal-filter-pills
    [timeframe]="timeframe()"
    [direction]="direction()"
    (timeframeChange)="timeframeChange.emit($event)"
    (directionChange)="directionChange.emit($event)">
  </app-signal-filter-pills>

  <div class="header-spacer"></div>

  <!-- Global chart interval — independent of the signal-timeframe filter. -->
  <div class="gh-chart-toggle" role="group" aria-label="Chart timeframe" title="Chart interval for all cards">
    <span class="gh-chart-label">Chart</span>
    <div class="gh-chart-pills">
      <button type="button" [class.active]="chartTimeframe() === SignalTimeframe.DAILY"
              (click)="chartTimeframeChange.emit(SignalTimeframe.DAILY)">D</button>
      <button type="button" [class.active]="chartTimeframe() === SignalTimeframe.WEEKLY"
              (click)="chartTimeframeChange.emit(SignalTimeframe.WEEKLY)">W</button>
    </div>
  </div>

  <app-rh-select-menu
    label="Group"
    [options]="dimensionOptions"
    [value]="groupDimension()"
    (valueChange)="dimensionChange.emit($event)">
  </app-rh-select-menu>

  <app-rh-select-menu
    label="List"
    [options]="sentinelOptions"
    [optionGroups]="listGroups()"
    [value]="listFilter()"
    (valueChange)="listFilterChange.emit($event)">
  </app-rh-select-menu>

  <button class="icon-btn" 
 [disabled]="refreshing()" title="Refresh — switch to the newest run or reload signals"
 (click)="refresh.emit()">
    <span class="dse-icon">refresh</span>
  </button>
  <button class="icon-btn" [title]="allGroupsExpanded() ? 'Collapse all groups' : 'Expand all groups'"
 (click)="expandAllToggle.emit()">
    <span class="dse-icon">{{ allGroupsExpanded() ? 'unfold_less' : 'unfold_more' }}</span>
  </button>
</div>
