<div class="ds-panel gallery-group" [class.open]="open()">
  <button type="button" class="acc-head group-header"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="'gg-body-' + group().label"
    (click)="onToggle()">
    <span class="group-title">
      <span class="group-label">{{ group().label }}</span>
      <span class="group-summary">
        {{ group().cards.length }} signals
        @if (dailyCount() > 0) {
          <span class="grp-tf">D {{ dailyCount() }}</span>
        }
        @if (weeklyCount() > 0) {
          <span class="grp-tf">W {{ weeklyCount() }}</span>
        }
        @if (longCount() > 0) {
          <span class="grp-dir long">↑ {{ longCount() }}</span>
        }
        @if (shortCount() > 0) {
          <span class="grp-dir short">↓ {{ shortCount() }}</span>
        }
      </span>
    </span>
    <span class="dse-icon chev" aria-hidden="true">expand_more</span>
  </button>
  <div class="acc-body" role="region" [id]="'gg-body-' + group().label">
    <div class="gallery-grid">
      @for (card of group().cards; track card.key) {
        <app-gallery-card
          [card]="card"
          [actionsDisabled]="actionsDisabled()"
          [actionBusy]="busyKeys().has(card.key)"
          (action)="cardAction.emit($event)" />
      }
    </div>
  </div>
</div>
