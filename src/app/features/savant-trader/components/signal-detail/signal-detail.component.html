@if (showChart()) {
  <div class="signal-detail">
    @if (showToolbar()) {
    <app-chart-toolbar
      [selectedInterval]="selectedInterval()"
      [selectedRange]="selectedRange()"
      [showZoomToolbar]="showZoomToolbar()"
      [activeChartInterval]="activeChartInterval()"
      [layout]="uiStateService.chartLayout()"
      [fullscreen]="uiStateService.fullscreen()"
      [logScale]="logScale()"
      [indicatorOptions]="activeChartIndicatorOptions()"
      [selectedIndicatorIds]="activeSelectedIndicatorIds()"
      [symbolIndex]="symbolIndex()"
      [symbolCount]="symbolCount()"
      (intervalChange)="toolbarState.setInterval($event)"
      (rangeChange)="toolbarState.setRange($event)"
      (zoomToggle)="toolbarState.toggleZoomToolbar()"
      (layoutToggle)="uiStateService.toggleChartLayout()"
      (fullscreenToggle)="uiStateService.toggleFullscreen()"
      (logScaleToggle)="toolbarState.toggleLogScale()"
      (indicatorToggle)="toolbarState.applyIndicatorToggle($event)"
      (prevSymbol)="prevSymbol.emit()"
      (nextSymbol)="nextSymbol.emit()">
      <app-symbol-list-actions chartToolbarCenter
        [symbol]="manualSymbol()!"
        [listCatalog]="listCatalog()"
        (toggleList)="toggleList.emit($event)">
      </app-symbol-list-actions>
    </app-chart-toolbar>
    }

    <!-- Chart Area -->
    <div class="chart-area">
      @if (chartLoading()) {
        <div class="chart-loading">
          <mat-spinner diameter="32"></mat-spinner>
          <span>Loading chart data...</span>
        </div>
      } @else if (uiStateService.chartLayout() === ChartLayout.TRIPLE) {
        <!-- Triple chart layout: left (W top, M bottom) | right (D) -->
        <div class="triple-chart-grid">
          <div class="triple-left">
            <div class="triple-chart-cell" [class.active-chart]="activeChartInterval() === BarsInterval.WEEKLY" (click)="toolbarState.setActiveChart(BarsInterval.WEEKLY)">
              <app-flex-chart
                [chartData]="chartDataWeekly()"
                [config]="chartConfigWeekly()"
                [syncCrosshairDate]="crosshairDate()"
                [syncCrosshairPrice]="crosshairPrice()"
                (crosshairDateChange)="onCrosshairChange($event)"
                (crosshairPriceChange)="onCrosshairPriceChange($event)"
                height="100%">
              </app-flex-chart>
            </div>
            <div class="triple-chart-cell" [class.active-chart]="activeChartInterval() === BarsInterval.MONTHLY" (click)="toolbarState.setActiveChart(BarsInterval.MONTHLY)">
              <app-flex-chart
                [chartData]="chartDataMonthly()"
                [config]="chartConfigMonthly()"
                [syncCrosshairDate]="crosshairDate()"
                [syncCrosshairPrice]="crosshairPrice()"
                (crosshairDateChange)="onCrosshairChange($event)"
                (crosshairPriceChange)="onCrosshairPriceChange($event)"
                height="100%">
              </app-flex-chart>
            </div>
          </div>
          <div class="triple-right" [class.active-chart]="activeChartInterval() === BarsInterval.DAILY" (click)="toolbarState.setActiveChart(BarsInterval.DAILY)">
            <app-flex-chart
              [chartData]="chartData()"
              [config]="chartConfigDaily()"
              [syncCrosshairDate]="crosshairDate()"
              [syncCrosshairPrice]="crosshairPrice()"
              (crosshairDateChange)="onCrosshairChange($event)"
              (crosshairPriceChange)="onCrosshairPriceChange($event)"
              height="100%">
            </app-flex-chart>
          </div>
        </div>
      } @else {
        <app-flex-chart 
          [chartData]="activeChartData()" 
          [config]="chartConfig()"
          height="100%">
        </app-flex-chart>
      }
    </div>
  </div>
} @else {
  <div class="detail-empty">
    <mat-icon>search</mat-icon>
    <p>Enter a symbol to view charts</p>
  </div>
}
