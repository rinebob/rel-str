<div class="chart-toolbar">
  <!-- Left: Indicators menu -->
  <app-indicator-menu
    [options]="indicatorOptions()"
    [selectedIds]="selectedIndicatorIds()"
    [activeChartBadge]="activeChartInterval() === BarsInterval.WEEKLY ? 'W' : activeChartInterval() === BarsInterval.MONTHLY ? 'M' : 'D'"
    (toggle)="indicatorToggle.emit($event)">
  </app-indicator-menu>

  <button type="button" class="icon-btn" (click)="zoomToggle.emit()"
 [class.dim]="!showZoomToolbar()" [title]="showZoomToolbar() ? 'Hide zoom toolbar' : 'Show zoom toolbar'">
    <span class="dse-icon">{{ showZoomToolbar() ? 'zoom_in' : 'zoom_out' }}</span>
  </button>

  <!-- Spacer -->
  <span class="toolbar-spacer"></span>

  <!-- Symbol nav: prev/next within review queue -->
  @if (symbolCount() > 0) {
    <span class="symbol-nav">
      <button type="button" class="nav-btn" (click)="prevSymbol.emit()"
        [disabled]="symbolIndex() <= 0" title="Previous symbol">
        <span class="dse-icon">chevron_left</span>
      </button>
      <span class="nav-position">{{ symbolIndex() + 1 }}&nbsp;/&nbsp;{{ symbolCount() }}</span>
      <button type="button" class="nav-btn" (click)="nextSymbol.emit()"
        [disabled]="symbolIndex() >= symbolCount() - 1" title="Next symbol">
        <span class="dse-icon">chevron_right</span>
      </button>
    </span>
  }

  <!-- Center: caller-projected content (e.g., symbol list actions). -->
  <ng-content select="[chartToolbarCenter]"></ng-content>

  <!-- Right: D/W/M, range, layout, fullscreen -->
  <span class="pill-group flat">
    <button type="button" class="pill" [class.active]="selectedInterval() === BarsInterval.DAILY"
      (click)="intervalChange.emit(BarsInterval.DAILY)">D</button>
    <button type="button" class="pill" [class.active]="selectedInterval() === BarsInterval.WEEKLY"
      (click)="intervalChange.emit(BarsInterval.WEEKLY)">W</button>
    <button type="button" class="pill" [class.active]="selectedInterval() === BarsInterval.MONTHLY"
      (click)="intervalChange.emit(BarsInterval.MONTHLY)">M</button>
  </span>
  <span class="pill-group flat">
    <button type="button" class="pill" [class.active]="selectedRange() === 'recent'" (click)="rangeChange.emit('recent')">Recent</button>
    <button type="button" class="pill" [class.active]="selectedRange() === '6m'" (click)="rangeChange.emit('6m')">6M</button>
    <button type="button" class="pill" [class.active]="selectedRange() === '1y'" (click)="rangeChange.emit('1y')">1Y</button>
    <button type="button" class="pill" [class.active]="selectedRange() === '5y'" (click)="rangeChange.emit('5y')">5Y</button>
    <button type="button" class="pill" [class.active]="selectedRange() === 'all'" (click)="rangeChange.emit('all')">All</button>
  </span>

  <button type="button" class="icon-btn" (click)="layoutToggle.emit()" [title]="layout() === ChartLayout.SINGLE ? 'Three-chart layout' : 'Single-chart layout'">
    <span class="dse-icon">{{ layout() === ChartLayout.SINGLE ? 'grid_view' : 'crop_square' }}</span>
  </button>
  <button type="button" class="icon-btn" (click)="fullscreenToggle.emit()" [title]="fullscreen() ? 'Exit fullscreen' : 'Fullscreen'">
    <span class="dse-icon">{{ fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</span>
  </button>

  <app-log-scale-pill [logScale]="logScale()" (toggle)="logScaleToggle.emit()" />
</div>
