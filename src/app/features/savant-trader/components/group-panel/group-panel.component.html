<div class="ds-panel group-panel" [class.open]="open()">

  <div class="group-head-row">
    <button type="button" class="acc-head group-header"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="'gp-body-' + group().label"
      (click)="onToggle()">
      <span class="group-title">
        <span class="group-key">{{ group().label }}</span>
        <span class="group-summary">
          {{ visibleSymbolCount() }} symbols
          @if (visibleLongCount() > 0) {
            <span class="badge dir-long">↑ {{ visibleLongCount() }} long</span>
          }
          @if (visibleShortCount() > 0) {
            <span class="badge dir-short">↓ {{ visibleShortCount() }} short</span>
          }
        </span>
      </span>
      <span class="dse-icon chev" aria-hidden="true">expand_more</span>
    </button>

    <button type="button" class="icon-btn expand-all-btn"
      (click)="onExpandAll($event)" [title]="open() ? 'Collapse all' : 'Expand all'">
      <span class="dse-icon">{{ open() ? 'unfold_less' : 'unfold_more' }}</span>
    </button>
  </div>

  <div class="acc-body" role="region" [id]="'gp-body-' + group().label">
    <div class="dse-acc symbol-accordion">
      @for (row of visibleRows(); track row.profile.symbol) {
      <app-symbol-row
        [row]="row"
        [isSelected]="selectedSymbol() === row.profile.symbol"
        [isChartActive]="quickChartSymbol() === row.profile.symbol"
        [expanded]="open()"
        [listCatalog]="listCatalog()"
        [isActionableRun]="isActionableRun()"
        (select)="rowSelect.emit(row.profile.symbol)"
        (viewQuickCharts)="rowViewQuickCharts.emit($event)"
        (markForReview)="rowMarkForReview.emit($event)"
        (trade)="rowTrade.emit($event)"
        (toggleList)="rowToggleList.emit($event)">
      </app-symbol-row>
      }
    </div>
  </div>
</div>
