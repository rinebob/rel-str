<div class="dash-layout">

    <div class="drawer-backdrop" [class.open]="selectStockOpen()" (click)="handleCloseSelectStockPanel()"></div>

    <aside class="dash-drawer" [class.open]="selectStockOpen()"
           role="dialog" aria-modal="true" aria-label="Select stock"
           cdkTrapFocusAutoCapture [cdkTrapFocus]="selectStockOpen()"
           [attr.aria-hidden]="!selectStockOpen()">

        <rs-select-stock-panel />

        <div class="close-button-container">

            <button class="task-button ds-btn fill" (click)="handleCloseSelectStockPanel()">close</button>

        </div>

    </aside>

    <div class="dash-content">

            <!-- FOR DEVELOPMENT ONLY -->
        <!-- <rs-select-stock-panel /> -->

        <div class="dashboard-container">

            <div class="header-container">

                <div class="name-container">

                    <p class="header-text">List: {{rsAppStore.selectedStockList().name}}</p>
                    <p class="header-text">Baseline symbol: {{rsAppStore.selectedStockList().baseline}}</p>

                </div>

                <div class="buttons-container">

                    <button class="task-button ds-btn fill" (click)="handleSelectStock()">Select stock / list</button>
                    <button class="task-button ds-btn fill" (click)="handleChangeTimeframe()">Timeframe</button>
                    <button class="task-button ds-btn fill" (click)="handleSortFilter()">Sort / filter</button>

                </div>

            </div>

            <div class="heatmap-container">

                <rs-heatmap />

            </div>

        </div>

    </div>

</div>
