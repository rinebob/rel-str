<div class="positions-view-root">

        <!-- STATUS -->
    <section class="pv-status" aria-live="polite">
        @if (store.loading()) {
            <div class="loading">Loading…</div>
        }
        @if (store.error()) {
            <div class="error">Error: {{ store.error() }}</div>
        }
    </section>
    
        <!-- OPEN POSITIONS -->
    <section class="pv-grid" aria-label="Open Positions View">
        <header class="pv-header">
            <h2 class="pv-title">Open positions</h2>
        </header>

        <app-pv-open-summary></app-pv-open-summary>
        <app-pv-open-grid></app-pv-open-grid>
    </section>

        <!-- CLOSED POSITIONS -->
    <section class="pv-grid pv-grid--closed" aria-label="Closed Positions View">
        <header class="pv-header">
            <h2 class="pv-title">Closed positions</h2>
        </header>

        @if (store.closedList().length === 0 && !store.loading() && !store.error()) {
            <div class="pv-empty" aria-live="polite">
            <div class="empty">No closed positions.</div>
            </div>
        } @else {
            <app-pv-closed-grid></app-pv-closed-grid>
        }
    </section>
</div>
