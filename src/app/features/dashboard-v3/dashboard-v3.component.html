<div class="dashboard-container">

    <div class="baseline-chip-row">
        <mat-chip-listbox class="baseline-chip-list" [multiple]="false">
            @for (b of dashboardV3Store.baselines(); track b.id) {
                <mat-chip-option
                    class="baseline-chip"
                    [selected]="selectedBaseline()?.id === b.id"
                    (click)="onBaselineChipClick(b.id)">
                    {{ b.label }}
                </mat-chip-option>
            }
        </mat-chip-listbox>
    </div>

    <div class="header-container">

        <div class="thresholds-container">
            <span class="thresholds-label">Thresholds</span>
            <div class="thresholds-inputs">
                <label class="threshold-field">
                    N→L
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().neutralToLong"
                        (change)="onThresholdChange('neutralToLong', $any($event.target).value)" />
                </label>
                <label class="threshold-field">
                    L→N
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().longToNeutral"
                        (change)="onThresholdChange('longToNeutral', $any($event.target).value)" />
                </label>
                <label class="threshold-field">
                    N→S
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().neutralToShort"
                        (change)="onThresholdChange('neutralToShort', $any($event.target).value)" />
                </label>
                <label class="threshold-field">
                    S→N
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().shortToNeutral"
                        (change)="onThresholdChange('shortToNeutral', $any($event.target).value)" />
                </label>
            </div>
        </div>

        <div class="buttons-container">
            <div class="interval-buttons">
                <button mat-button 
                        class="interval-button" 
                        [class.active]="selectedInterval() === timeframe.DAILY"
                        (click)="setInterval(timeframe.DAILY)">D</button>
                <button mat-button 
                        class="interval-button" 
                        [class.active]="selectedInterval() === timeframe.WEEKLY"
                        (click)="setInterval(timeframe.WEEKLY)">W</button>
                <button mat-button 
                        class="interval-button" 
                        [class.active]="selectedInterval() === timeframe.MONTHLY"
                        (click)="setInterval(timeframe.MONTHLY)">M</button>
            </div>

            <div class="mode-selector">
                <mat-button-toggle-group
                    [value]="heatmapMode()"
                    (change)="onModeChange($event.value)">
                    <mat-button-toggle value="gradient">Gradient</mat-button-toggle>
                    <mat-button-toggle value="lns3">3-Zone</mat-button-toggle>
                </mat-button-toggle-group>
            </div>

            <div class="palette-selector">
                <mat-button-toggle-group
                    class="palette-toggle-group"
                    [value]="selectedPaletteId()"
                    (change)="onPaletteChange($event.value)">
                    @for (p of palettes(); track p.id) {
                        <mat-button-toggle class="palette-toggle" [value]="p.id">
                            {{ p.label }}
                        </mat-button-toggle>
                    }
                </mat-button-toggle-group>
            </div>

            <button mat-button class="task-button" (click)="handleSortFilter()">Sort/Filter</button>
        </div>

    </div>
    <div class="heatmap-container">
        <rs-heatmap-v3 />
    </div>

</div>
