<div class="dashboard-container">

    <div class="baseline-chip-row">
        <mat-chip-listbox class="baseline-chip-list" [multiple]="false">
            @for (b of dashboardV3Store.baselines(); track b.id) {
                <mat-chip-option
                    class="baseline-chip"
                    [selected]="selectedBaseline()?.id === b.id"
                    (click)="onBaselineChipClick(b.id)">
                    {{ b.id }}
                </mat-chip-option>
            }
        </mat-chip-listbox>
    </div>

    <div class="header-container">

        <div class="thresholds-container">
            <span class="thresholds-label">Thresholds</span>
            <div class="thresholds-inputs">
                <label class="threshold-field">
                    N→L
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().neutralToLong"
                        (change)="onThresholdChange('neutralToLong', $any($event.target).value)" />
                </label>
                <label class="threshold-field">
                    L→N
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().longToNeutral"
                        (change)="onThresholdChange('longToNeutral', $any($event.target).value)" />
                </label>
                <label class="threshold-field">
                    N→S
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().neutralToShort"
                        (change)="onThresholdChange('neutralToShort', $any($event.target).value)" />
                </label>
                <label class="threshold-field">
                    S→N
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="1"
                        [value]="thresholdConfig().shortToNeutral"
                        (change)="onThresholdChange('shortToNeutral', $any($event.target).value)" />
                </label>
            </div>
        </div>

        <div class="buttons-container">
            <div class="interval-buttons">
                <button 
 class="interval-button ds-btn" 
 [class.active]="selectedInterval() === timeframe.DAILY"
 (click)="setInterval(timeframe.DAILY)">D</button>
                <button 
 class="interval-button ds-btn" 
 [class.active]="selectedInterval() === timeframe.WEEKLY"
 (click)="setInterval(timeframe.WEEKLY)">W</button>
                <button 
 class="interval-button ds-btn" 
 [class.active]="selectedInterval() === timeframe.MONTHLY"
 (click)="setInterval(timeframe.MONTHLY)">M</button>
            </div>

            <div class="mode-selector">
                <div
                    class="pill-group" role="radiogroup" aria-label="Heatmap mode">
                    <button type="button" class="pill" role="radio"
                        [attr.aria-checked]="heatmapMode() === 'gradient'"
                        [class.active]="heatmapMode() === 'gradient'"
                        (click)="onModeChange('gradient')">Gradient</button>
                    <button type="button" class="pill" role="radio"
                        [attr.aria-checked]="heatmapMode() === 'lns3'"
                        [class.active]="heatmapMode() === 'lns3'"
                        (click)="onModeChange('lns3')">3-Zone</button>
                </div>
            </div>

            <div class="rsma-selector">
                <div
                    class="pill-group" role="radiogroup" aria-label="RSMA window">
                    <button type="button" class="pill" role="radio"
                        [attr.aria-checked]="rsmaWindow() === 5"
                        [class.active]="rsmaWindow() === 5"
                        (click)="onRsmaWindowChange(5)">RSMA 5</button>
                    <button type="button" class="pill" role="radio"
                        [attr.aria-checked]="rsmaWindow() === 10"
                        [class.active]="rsmaWindow() === 10"
                        (click)="onRsmaWindowChange(10)">RSMA 10</button>
                    <button type="button" class="pill" role="radio"
                        [attr.aria-checked]="rsmaWindow() === 30"
                        [class.active]="rsmaWindow() === 30"
                        (click)="onRsmaWindowChange(30)">RSMA 30</button>
                </div>
            </div>

            <div class="palette-selector">
                <div
                    class="pill-group palette-toggle-group" role="radiogroup" aria-label="Palette">
                    @for (p of palettes(); track p.id) {
                        <button type="button" class="pill palette-toggle" role="radio"
                            [attr.aria-checked]="selectedPaletteId() === p.id"
                            [class.active]="selectedPaletteId() === p.id"
                            (click)="onPaletteChange(p.id)">
                            {{ p.label }}
                        </button>
                    }
                </div>
            </div>

            <button class="task-button ds-btn" (click)="handleSortFilter()">Sort/Filter</button>
        </div>

    </div>
    <div class="heatmap-container">
        <rs-heatmap-v4 />
    </div>

</div>
