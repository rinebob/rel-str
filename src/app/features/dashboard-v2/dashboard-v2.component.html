<mat-drawer-container [hasBackdrop]="true">

    <mat-drawer #selectStock mode="over" position="end">

        <rs-select-stock-panel-v2 />

        <div class="close-button-container">

            <button mat-flat-button class="task-button" (click)="handleCloseSelectStockPanel()">close</button>

        </div>

    </mat-drawer>

    <mat-drawer-content>

        <div class="dashboard-container">

            <div class="header-container">

                <div class="name-container">

                    <p class="header-text">List: {{rsAppStore.selectedStockListV2().name}}</p>
                    <p class="header-text">Baseline symbol: {{rsAppStore.selectedStockListV2().baseline}}</p>

                </div>
                
                <div class="buttons-container">
    
                    <button mat-flat-button class="task-button" (click)="handleSelectStock()">Select pairs list</button>
                    <button mat-flat-button class="task-button" (click)="handleChangeTimeframe()">Timeframe</button>
                    <button mat-flat-button class="task-button" (click)="handleSortFilter()">Sort / filter</button>
            
                </div>

            </div>
        
            <div class="heatmap-container">
        
                <rs-heatmap-v2 />
                
                <!-- Dev-only: show tracked symbols payload from store -->
                <pre style="max-height: 20rem; overflow:auto; background:#111; color:#ddd; padding:0.5rem;">
                    {{ rsAppStore.supportedSymbolsListV2() }}
                </pre>

                <!-- ================================================================ -->
                <!-- Archive Read Toggle (DEV-only): Legacy vs Archive                 -->
                <!-- Clearly labeled controls to switch the heatmap data pipeline.     -->
                <!-- Default is Legacy; Archive delegates to Legacy until implemented. -->
                <!-- ================================================================ -->
                <div style="display:flex; gap: 0.5rem; align-items:center; margin-top: 0.5rem;">
                    <span>Data Source (DEV):</span>
                    <button mat-stroked-button color="primary" (click)="handleToggleDataSource(DataSourceMode.LEGACY)">
                        Legacy
                    </button>
                    <button mat-stroked-button color="accent" (click)="handleToggleDataSource(DataSourceMode.ARCHIVE)">
                        Archive
                    </button>
                    <span style="opacity:0.7;">Current: {{ rsAppStore.getDataSourceModeV2() }}</span>
                </div>

            </div>

        </div>

    </mat-drawer-content>

</mat-drawer-container>
