@if(rsAppStore.showFormV2() === true) {
<!-- @if(true) { -->

    <p class="form-header">{{((rsAppStore.formModeV2()) === FormMode.CREATE ? FORM_MODE_CREATE_TEXT : FORM_MODE_EDIT_TEXT) | uppercase}}</p>

    <div class="form-container" [formGroup]="listForm">

        <div class="baseline-row name-row">
            <label class="dse-field list-name-field">
                <span class="field-label">List name</span>
                
                <input
                       type="text"
                       class="field-input list-form-control"
                       placeholder="Enter name of list"
                       formControlName="nameControl"
                >

            </label>
        </div>

        <div class="baseline-row">
            <label class="dse-field baseline-field">
                <span class="field-label">Baseline ticker</span>
                
                <input
                       type="text"
                       class="field-input list-form-control"
                       placeholder="Enter baseline ticker symbol"
                       formControlName="baselineControl"
                >

            </label>

            <label class="dse-field symbol-autocomplete-field">
                <span class="field-label">Add symbol</span>
                
                <input class="field-input"
                       type="text"
                       [matAutocomplete]="symbolAuto"
                       [formControl]="symbolSearchControl"
                       placeholder="Search symbols to add"
                >

                <mat-autocomplete #symbolAuto="matAutocomplete" (optionSelected)="handleSymbolSelectedFromAutocomplete($event.option.value)">
                    @for (symbol of filteredSymbols(); track symbol.symbol) {
                        <mat-option [value]="symbol">
                            {{ symbol.symbol }}  {{ symbol.company }}
                        </mat-option>
                    }
                </mat-autocomplete>

            </label>
        </div>

    </div>

    <rs-symbol-picker-v2
        (localSymbolsOuput)="handleLocalSymbolsOutput($event)" />

    <div class="buttons-container">
                
        <button class="crud-button ds-btn fill" (click)="handleSaveList()">
            <p class="button-text">save</p>
        </button>
        
        <button class="crud-button ds-btn fill" (click)="handleCancel()">
            <p class="button-text">cancel</p>
        </button>

    </div>

}
