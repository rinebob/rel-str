<div class="tj-root">
  <header class="tj-toolbar">
    <span class="tj-spacer"></span>
    <button class="ds-btn outline" (click)="openNewTrade()">
      <span class="dse-icon">add</span>
      <span>New trade</span>
    </button>
  </header>

  <section class="tj-filters" aria-label="Trade filters">
    <label class="dse-field tj-filter-field tj-filter-field--symbol">
      <span class="field-label">Symbol</span>
      <input class="field-input" placeholder="Search symbol" />
    </label>

    <label class="dse-field tj-filter-field tj-filter-field--status">
      <span class="field-label">Status</span>
      <select class="dse-select">
        <option value="">All</option>
        <option value="OPEN">Open</option>
        <option value="CLOSED">Closed</option>
        <option value="CANCELED">Canceled</option>
      </select>
    </label>

    <label class="dse-field tj-filter-field tj-filter-field--direction">
      <span class="field-label">Direction</span>
      <select class="dse-select">
        <option value="">Any</option>
        <option value="LONG">Long</option>
        <option value="SHORT">Short</option>
      </select>
    </label>

    <label class="dse-check"><input type="checkbox" class="tj-filter-checkbox">Include newsletter candidates only</label>
  </section>

  <section class="tj-main" aria-label="Trade list and details">
    <app-trade-journal-table
      [trades]="trades()"
      [selectedTradeId]="selectedTradeId()"
      (select)="selectTrade($event)"
      (edit)="openEditTrade($event)"
      (delete)="onDeleteTrade($event)"
    ></app-trade-journal-table>

    @if (selectedTradeId()) {
      <aside class="tj-detail">
        <header class="tj-detail-toolbar">
          <span>Trade details</span>
          <span class="tj-spacer"></span>
          <button class="ds-btn outline" (click)="openNewTrade()">
            <span class="dse-icon">add</span>
            <span>New trade</span>
          </button>
        </header>
        <div class="tj-detail-body">
          @if (selectedTrade(); as trade) {
            <app-trade-journal-detail-card
              [trade]="trade"
              (edit)="openEditTrade($event)"
            ></app-trade-journal-detail-card>
          } @else {
            <div class="tj-detail-placeholder">
              Trade not found.
            </div>
          }
        </div>
      </aside>
    } @else {
      <aside class="tj-detail tj-detail--empty">
        <header class="tj-detail-toolbar">
          <span>Trade details</span>
        </header>
        <div class="tj-detail-body">
          <div class="tj-detail-placeholder tj-detail-placeholder--empty">
            Select a trade from the table to view details.
          </div>
        </div>
      </aside>
    }

  </section>
</div>
