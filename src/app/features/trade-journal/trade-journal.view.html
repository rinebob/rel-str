<div class="tj-root">
  <mat-toolbar color="primary" class="tj-toolbar">
    <span>Trade Journal</span>
    <span class="tj-spacer"></span>
    <button mat-stroked-button color="accent" (click)="openNewTrade()">
      <mat-icon>add</mat-icon>
      <span>New trade</span>
    </button>
  </mat-toolbar>

  <section class="tj-filters" aria-label="Trade filters">
    <mat-form-field appearance="outline" class="tj-filter-field tj-filter-field--symbol">
      <mat-label>Symbol</mat-label>
      <input matInput placeholder="Search symbol" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="tj-filter-field tj-filter-field--status">
      <mat-label>Status</mat-label>
      <mat-select>
        <mat-option value="">All</mat-option>
        <mat-option value="OPEN">Open</mat-option>
        <mat-option value="CLOSED">Closed</mat-option>
        <mat-option value="CANCELED">Canceled</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="tj-filter-field tj-filter-field--direction">
      <mat-label>Direction</mat-label>
      <mat-select>
        <mat-option value="">Any</mat-option>
        <mat-option value="LONG">Long</mat-option>
        <mat-option value="SHORT">Short</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-checkbox class="tj-filter-checkbox">Include newsletter candidates only</mat-checkbox>
  </section>

  <section class="tj-main" aria-label="Trade list and details">
    <app-trade-journal-table
      [trades]="trades()"
      [selectedTradeId]="selectedTradeId()"
      (select)="selectTrade($event)"
      (edit)="openEditTrade($event)"
      (delete)="onDeleteTrade($event)"
    ></app-trade-journal-table>

    <aside class="tj-detail" *ngIf="selectedTradeId(); else noSelection">
      <mat-toolbar color="primary" class="tj-detail-toolbar">
        <span>Trade details</span>
        <span class="tj-spacer"></span>
        <button mat-stroked-button color="accent" (click)="openNewTrade()">
          <mat-icon>add</mat-icon>
          <span>New trade</span>
        </button>
      </mat-toolbar>
      <div class="tj-detail-body">
        @if (selectedTrade(); as trade) {
          <app-trade-journal-detail-card
            [trade]="trade"
            (edit)="openEditTrade($event)"
          ></app-trade-journal-detail-card>
        } @else {
          <div class="tj-detail-placeholder">
            Trade not found.
          </div>
        }
      </div>
    </aside>

    <ng-template #noSelection>
      <aside class="tj-detail tj-detail--empty">
        <mat-toolbar color="primary" class="tj-detail-toolbar">
          <span>Trade details</span>
        </mat-toolbar>
        <div class="tj-detail-body">
          <div class="tj-detail-placeholder tj-detail-placeholder--empty">
            Select a trade from the table to view details.
          </div>
        </div>
      </aside>
    </ng-template>
  </section>
</div>
