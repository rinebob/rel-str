
<div class="chat-container">

    @for(message of (messages$ | async); track message) {

        {{message}}

        @if(message) {

            <div class="message-container">
    
                <img class="message-image"
                     [src]="message['profilePicUrl']"
                     [alt]="message['name']"
                />
    
                <div class="content-container">
    
                    <div class="message-text">
    
                        {{message['text']}}
                    
                    </div>
    
                    <div class="image-container">
                        
                        <img class="message-image" [src]="message['imageUrl']" alt="image" />
                    
                    </div>
    
                    <span class="timestamp">
                        <!-- {{message['timestamp'].toDate().toLocaleTimeString()}} -->
                    </span>
    
                </div>
    
    
            </div>
            
        }

        @if(message['response']) {

            <div class="response-container">

                <div class="message-text">

                    {{message['response']}}
                
                </div>

            </div>

        }

    }

    <div class="form-container">

        <div class="upload-button-container">

            <input type="file" class="file-input hidden" (change)="this.uploadImage($event)" #fileUpload>
            
            <button color="primary" class="upload-btn" (click)="fileUpload.click()">
                upload image
            </button>

            <textarea name="" id="" placeholder="Write your thoughts here..." [(ngModel)]="this.text">

            </textarea>

            <button class="send-button" (click)="this.sendTextMessage()">
                send message
            </button>

        </div>

    </div>

</div>
