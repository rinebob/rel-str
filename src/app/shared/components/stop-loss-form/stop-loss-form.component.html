<div class="stop-loss-section">
  <div class="sl-header">
    <span class="sl-title">Stop Loss</span>
    <span class="sl-risk">Risk: {{ dollarRisk() | currency:'USD':'symbol':'1.2-2' }}</span>
  </div>
  <div class="sl-field">
    <span class="sl-label">$</span>
    <div class="stepper">
      <button type="button" class="step-btn" aria-label="stop-price-down" (click)="stopPriceDown()">&#9660;</button>
      <input class="sl-input" [value]="stopLossPrice()" (input)="onStopPriceChange($event)" placeholder="0.00" [disabled]="disabled()">
      <button type="button" class="step-btn" aria-label="stop-price-up" (click)="stopPriceUp()">&#9650;</button>
    </div>
  </div>
  <div class="sl-field">
    <span class="sl-label">%</span>
    <div class="stepper">
      <button type="button" class="step-btn" aria-label="stop-percent-down" (click)="stopPercentDown()">&#9660;</button>
      <input class="sl-input" [value]="stopLossPercent()" (input)="onStopPercentChange($event)" placeholder="8.0" [disabled]="disabled()">
      <button type="button" class="step-btn" aria-label="stop-percent-up" (click)="stopPercentUp()">&#9650;</button>
    </div>
  </div>
  @if (showOrderParams()) {
    <div class="sl-field">
      <span class="sl-label">TIF</span>
      <div class="pill-group">
        <button type="button" class="pill" [class.active]="timeInForce() === 'gfd'" [disabled]="disabled()" (click)="timeInForce.set('gfd')">Day</button>
        <button type="button" class="pill" [class.active]="timeInForce() === 'gtc'" [disabled]="disabled()" (click)="timeInForce.set('gtc')">GTC</button>
      </div>
    </div>
    <div class="sl-field">
      <span class="sl-label">Hours</span>
      <div class="pill-group">
        <button type="button" class="pill" [class.active]="marketHours() === 'regular_hours'" [disabled]="disabled()" (click)="marketHours.set('regular_hours')">Regular</button>
        <button type="button" class="pill" disabled title="Robinhood rejects stop orders outside regular hours">Extended</button>
        <button type="button" class="pill" disabled title="Robinhood rejects stop orders outside regular hours">All Day</button>
      </div>
      <span class="sl-hint">Stops execute during regular hours only</span>
    </div>
  }
  <button mat-flat-button color="warn" (click)="onPlace()" [disabled]="!canPlace() || disabled()">
    <mat-icon>shield</mat-icon>
    Submit Stop Loss
  </button>

  @if (canPlace()) {
    <div class="sl-preview">
      <h4>Preview</h4>
      <pre>{{ preview() | json }}</pre>
    </div>
  }
</div>
