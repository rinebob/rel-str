<section class="signup">
  <h1 class="signup__title">Create your account</h1>

  @if (error()) {
    <div class="signup__error" role="alert">{{ error()?.message }}</div>
  }

  <form class="signup__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <label class="signup__label">
      <span>Display name</span>
      <input class="signup__input" type="text" formControlName="displayName" autocomplete="name" placeholder="Your name" />
    </label>

    <label class="signup__label">
      <span>Email</span>
      <input class="signup__input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    </label>

    <label class="signup__label">
      <span>Password</span>
      <input class="signup__input" type="password" formControlName="password" autocomplete="new-password" placeholder="••••••••" />
    </label>

    <button class="signup__btn" type="submit" [disabled]="form.invalid || loading()">
      @if (loading()) { <span>Creating...</span> } @else { <span>Create account</span> }
    </button>
    <div style="margin-top: 6px; font-size: 12px; color: #666">
        Loading: {{ loading() }} | canSubmit(): {{ canSubmit() }}
      </div>
    <div style="margin-top: 8px; font-size: 12px; color: #666">
        Form valid: {{ form.valid }} |
        Email errors: {{ form.get('email')?.errors | json }} |
        Password errors: {{ form.get('password')?.errors | json }}
      </div>
  </form>

  <div class="signup__divider"><span>or</span></div>

  <button class="signup__google" type="button" (click)="onGoogle()" [disabled]="loading()">
    Continue with Google
  </button>
</section>
