<nav class="header-container">

    <button mat-icon-button class="menu-button" (click)="handleMenuOpen()" aria-label="Open navigation menu">
        
        <mat-icon>menu</mat-icon>
    
    </button>
    
    <p class="header-text">Savant Trader</p>

    @if (pageInfo(); as info) {
        <div class="page-identity">
            <mat-icon class="page-icon" aria-hidden="true">{{ info.icon }}</mat-icon>
            <h1 class="page-title">{{ info.title }}</h1>
        </div>
    }

    <div class="nav-buttons-container">

        <button mat-icon-button class="theme-toggle" (click)="theme.toggle()"
                [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
            <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <button mat-icon-button class="fullscreen-toggle" (click)="uiState.toggleFullscreen()" aria-label="Enter fullscreen">
            <mat-icon>fullscreen</mat-icon>
        </button>

        <!-- Auth-aware section -->
        @if (!isAuthenticated()) {
          <button mat-button (click)="onLogin()" [disabled]="loading()">Login</button>
          <button mat-raised-button color="primary" (click)="onSignup()" [disabled]="loading()">Sign up</button>
        } @else {
          <button mat-stroked-button data-testid="new-order-btn"
                  (click)="newOrder.emit()">
            <mat-icon>add</mat-icon>
            New Order
          </button>
          <span class="user-label">{{ user()?.displayName || user()?.email }}</span>
          <button mat-raised-button color="primary" (click)="onSignOut()" [disabled]="loading()">Logout</button>
        }
    </div>
    
</nav>
