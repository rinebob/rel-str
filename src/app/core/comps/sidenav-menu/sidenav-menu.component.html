
<div class="logo-container">

    <button type="button" mat-icon-button class="menu-button" (click)="handleCloseSidenav()" aria-label="Close navigation menu">

        <mat-icon>close</mat-icon>

    </button>

</div>

<div class="sidenav-menu-container">

    <div class="main-menu-container">

        @for (section of sections(); track $index) {

            @if (section.label) {

                <div class="nav-section-label">{{ section.label }}</div>

            }

            @for (item of section.items; track item.name) {

                @if (item.children?.length) {

                    <button type="button" class="nav-menu-item nav-submenu-trigger"
                                   [matMenuTriggerFor]="submenu"
                    >

                        {{item.text}}

                    </button>

                    <mat-menu #submenu="matMenu">

                        @for (child of item.children; track child.name) {

                            <button type="button" mat-menu-item
                                           (click)="handleNavigation(child)"
                            >

                                {{child.text}}

                            </button>

                        }

                    </mat-menu>

                } @else {

                    <button type="button" class="nav-menu-item"
                                   (click)="handleNavigation(item)"
                    >

                        {{item.text}}

                    </button>

                }

            }

        }

    </div>

</div>
