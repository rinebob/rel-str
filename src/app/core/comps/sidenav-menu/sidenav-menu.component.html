
<div class="logo-container">

    <button type="button" class="menu-button icon-btn" (click)="handleCloseSidenav()" aria-label="Close navigation menu">

        <mat-icon>close</mat-icon>

    </button>

</div>

<div class="sidenav-menu-container">

    <div class="main-menu-container">

        @for (section of sections(); track $index) {

            @if (section.label) {

                <div class="nav-section-label">{{ section.label }}</div>

            }

            @for (item of section.items; track item.name) {

                @if (item.children?.length) {

                    <div class="nav-submenu-host">

                    <button type="button" class="nav-menu-item nav-submenu-trigger"
                                   aria-haspopup="menu"
                                   [attr.aria-expanded]="openSubmenu() === item.name"
                                   (click)="toggleSubmenu(item.name, $event)"
                    >

                        {{item.text}}

                    </button>

                    @if (openSubmenu() === item.name) {

                    <div class="dse-menu nav-submenu" role="menu" (click)="$event.stopPropagation()">

                        @for (child of item.children; track child.name) {

                            <button type="button" class="menu-item" role="menuitem"
                                           (click)="handleNavigation(child); openSubmenu.set(null)"
                            >

                                {{child.text}}

                            </button>

                        }

                    </div>

                    }

                    </div>

                } @else {

                    <button type="button" class="nav-menu-item"
                                   (click)="handleNavigation(item)"
                    >

                        {{item.text}}

                    </button>

                }

            }

        }

    </div>

</div>
