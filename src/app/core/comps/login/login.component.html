<section class="login">
  <h1 class="login__title">Sign in</h1>

  @if (error()) {
    <div class="login__error" role="alert">{{ error()?.message }}</div>
  }

  <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <label class="login__label">
      <span>Email</span>
      <input class="login__input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    </label>

    <label class="login__label">
      <span>Password</span>
      <input class="login__input" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
    </label>

    <button class="login__btn" type="submit" [disabled]="form.invalid || loading()">
      @if (loading()) {
        <span>Signing in...</span>
      } @else {
        <span>Sign in</span>
      }
    </button>
  </form>

  <div class="login__divider"><span>or</span></div>

  <button class="login__google" type="button" (click)="onGoogle()" [disabled]="loading()">
    Continue with Google
  </button>
</section>
