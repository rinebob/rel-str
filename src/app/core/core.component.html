<div class="shell-layout">

    <div class="drawer-backdrop" [class.open]="sidenavOpen()" (click)="handleCloseSidenav()"></div>

    <aside class="shell-drawer" [class.open]="sidenavOpen()"
           role="dialog" aria-modal="true" aria-label="Site navigation"
           cdkTrapFocusAutoCapture [cdkTrapFocus]="sidenavOpen()"
           [attr.aria-hidden]="!sidenavOpen()">

        <rs-sidenav-menu (closeSidenav)="handleCloseSidenav()"
                         (navigate)="handleNavigation($event)"
        />

    </aside>

    <div class="shell-content" [style.--header-height]="ui.fullscreen() ? '0px' : 'var(--app-header-height)'">

        @if (!ui.fullscreen()) {
          <rs-header (openSidenav)="handleOpenSidenav()" (newOrder)="onNewOrder()" />
        } @else {
          <button class="header-reveal" (click)="ui.toggleFullscreen()" aria-label="Show header" title="Show header">
            @if (pageInfo(); as info) {
              <span class="dse-icon reveal-icon" aria-hidden="true">{{ info.icon }}</span>
              <span class="reveal-title">{{ info.title }}</span>
            }
            <span class="dse-icon">fullscreen_exit</span>
          </button>
        }

        <router-outlet></router-outlet>

    </div>

</div>
